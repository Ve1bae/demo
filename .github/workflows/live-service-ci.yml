name: Live Service CI/CD

on:
  push:
    branches:
      - live-service
  pull_request:
    paths:
      - "backend/**"
      - "frontend/demo/**"
      - "live-service/**"
      - "k8s/**"
      - "demo.sql"
      - ".github/workflows/live-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  KUBE_NAMESPACE: hangyin
  KIND_CLUSTER: live-ci
  FRONTEND_PORT: "18080"

jobs:
  test-build-deploy-smoke:
    name: Test, build and deploy the complete Kubernetes stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      test-mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hangyin_video
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            live-service/pom.xml

      - name: Test and package live service
        working-directory: live-service
        run: mvn -B verify

      - name: Test and package main backend
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client ffmpeg
          mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < demo.sql
          cd backend
          chmod +x mvnw
          ./mvnw -B verify

      - name: Build versioned application images
        run: |
          docker buildx build --load --platform linux/amd64 --provenance=false \
            --tag "hangyin/backend:${IMAGE_TAG}" backend
          docker buildx build --load --platform linux/amd64 --provenance=false \
            --build-arg IMAGE_VERSION="${IMAGE_TAG}" \
            --build-arg VCS_REF="${IMAGE_TAG}" \
            --tag "hangyin/live-service:${IMAGE_TAG}" live-service
          docker buildx build --load --platform linux/amd64 --provenance=false \
            --build-arg VITE_API_PORT="${FRONTEND_PORT}" \
            --tag "hangyin/frontend:${IMAGE_TAG}" frontend/demo
          docker image inspect \
            "hangyin/backend:${IMAGE_TAG}" \
            "hangyin/live-service:${IMAGE_TAG}" \
            "hangyin/frontend:${IMAGE_TAG}"

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Install metrics server for HPA experiment
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type='json' -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,Hostname"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Load application images into Kind
        run: |
          kind load docker-image \
            "hangyin/backend:${IMAGE_TAG}" \
            "hangyin/live-service:${IMAGE_TAG}" \
            "hangyin/frontend:${IMAGE_TAG}" \
            --name "${KIND_CLUSTER}"

      - name: Create runtime configuration
        run: |
          if ! kubectl get storageclass -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}' | grep -q .; then
            kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
            kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          fi
          kubectl apply -f k8s/namespace.yml
          DB_PASSWORD="$(openssl rand -hex 24)"
          kubectl -n "${KUBE_NAMESPACE}" create secret generic hangyin-secrets \
            --from-literal=db-password="${DB_PASSWORD}" \
            --from-literal=minio-user=minioadmin \
            --from-literal=minio-password="$(openssl rand -hex 24)" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${KUBE_NAMESPACE}" create configmap hangyin-main-db-init \
            --from-file=001_demo.sql=demo.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${KUBE_NAMESPACE}" create configmap live-db-init \
            --from-file=001_live_schema.sql=live-service/sql/001_live_schema.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmaps.yml

      - name: Deploy persistent data and infrastructure
        run: |
          kubectl apply -f k8s/pvc.yml
          kubectl apply -f k8s/mysql.yml
          kubectl apply -f k8s/live-mysql.yml
          kubectl apply -f k8s/srs.yml
          kubectl apply -f k8s/minio.yml
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/mysql --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/live-mysql --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/srs --timeout=240s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/minio --timeout=240s

      - name: Deploy versioned application workloads
        run: |
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/live-service.yml
          kubectl apply -f k8s/frontend.yml
          kubectl -n "${KUBE_NAMESPACE}" set image deployment/backend \
            backend="hangyin/backend:${IMAGE_TAG}"
          kubectl -n "${KUBE_NAMESPACE}" set image deployment/live-service \
            live-service="hangyin/live-service:${IMAGE_TAG}"
          kubectl -n "${KUBE_NAMESPACE}" set image deployment/frontend \
            frontend="hangyin/frontend:${IMAGE_TAG}"
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/backend --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/live-service --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/frontend --timeout=240s

      - name: Verify the deployed full stack
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${KUBE_NAMESPACE}" port-forward service/frontend "${FRONTEND_PORT}:80" \
            > "${RUNNER_TEMP}/frontend-port-forward.log" 2>&1 &
          FRONTEND_FORWARD_PID=$!
          kubectl -n "${KUBE_NAMESPACE}" port-forward service/srs 1935:1935 \
            > "${RUNNER_TEMP}/srs-port-forward.log" 2>&1 &
          SRS_FORWARD_PID=$!
          FFMPEG_PID=""
          trap 'kill ${FFMPEG_PID} ${SRS_FORWARD_PID} ${FRONTEND_FORWARD_PID} 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${RUNNER_TEMP}/frontend-port-forward.log"
              exit 1
            fi
            sleep 2
          done

          # Rollout probes only establish that processes listen on their ports.
          # Poll the proxied APIs as well so database migrations and Spring
          # initialization have completed before the behavioral checks begin.
          API_BASE="http://127.0.0.1:${FRONTEND_PORT}"
          for attempt in $(seq 1 60); do
            if curl -fsS "${API_BASE}/api/videos/recommend" \
              -o "${RUNNER_TEMP}/recommend.json"; then
              if jq -e '.code == 200' "${RUNNER_TEMP}/recommend.json" > /dev/null; then
                break
              fi
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${RUNNER_TEMP}/recommend.json" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/recommend.json"

          for attempt in $(seq 1 30); do
            if curl -fsS "${API_BASE}/api/live/srs/health" \
              -o "${RUNNER_TEMP}/srs-health.json"; then
              if jq -e '.code == 200 and .data.enabled == true and .data.reachable == true' \
                "${RUNNER_TEMP}/srs-health.json" > /dev/null; then
                break
              fi
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat "${RUNNER_TEMP}/srs-health.json" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          SRS_HEALTH="$(cat "${RUNNER_TEMP}/srs-health.json")"
          echo "${SRS_HEALTH}"

          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Content-Type: application/json' -H 'X-User-Id: 10' \
              -d '{"title":"Kubernetes CI live room","categoryId":null}' \
              "${API_BASE}/api/live/rooms" \
              -o "${RUNNER_TEMP}/room.json"; then
              if jq -e '.code == 200' "${RUNNER_TEMP}/room.json" > /dev/null; then
                break
              fi
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat "${RUNNER_TEMP}/room.json" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          ROOM="$(cat "${RUNNER_TEMP}/room.json")"
          echo "${ROOM}"
          echo "${ROOM}" | jq -e \
            '.code == 200 and .data.userId == 10 and (.data.pushUrl | type == "string" and length > 0) and (.data.pullUrl | type == "string" and length > 0)'
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/srs/api/v1/versions" \
            | jq -e '.code == 0'
          ROOM_ID="$(echo "${ROOM}" | jq -r '.data.roomId')"
          STREAM_NAME="$(echo "${ROOM}" | jq -r '.data.streamName')"

          ffmpeg -hide_banner -loglevel error -re \
            -f lavfi -i testsrc=size=320x240:rate=10 \
            -f lavfi -i sine=frequency=1000:sample_rate=44100 \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p \
            -c:a aac -f flv "rtmp://127.0.0.1:1935/live/${STREAM_NAME}" \
            > "${RUNNER_TEMP}/ffmpeg-srs.log" 2>&1 &
          FFMPEG_PID=$!
          for attempt in $(seq 1 30); do
            if curl -sS --max-time 3 \
              "http://127.0.0.1:${FRONTEND_PORT}/srs/live/${STREAM_NAME}.flv" \
              -o "${RUNNER_TEMP}/live-smoke.flv" || [ "$?" -eq 28 ]; then
              if head -c 3 "${RUNNER_TEMP}/live-smoke.flv" | grep -q FLV; then
                break
              fi
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat "${RUNNER_TEMP}/ffmpeg-srs.log"
              exit 1
            fi
            sleep 2
          done
          curl -fsS "${API_BASE}/api/live/rooms/${ROOM_ID}" \
            -o "${RUNNER_TEMP}/room-active.json"
          cat "${RUNNER_TEMP}/room-active.json"
          # FLV header/data above is the authoritative playback check. The
          # optional SRS stream probe can lag behind the remuxed HTTP stream.
          jq -e '.code == 200 and .data.status == "online"' \
            "${RUNNER_TEMP}/room-active.json" > /dev/null
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/api/live/rooms/${ROOM_ID}/like" \
            | jq -e '.code == 200 and .data.likeCount == 0'
          curl -fsS -X POST -H 'X-User-Id: 10' \
            "http://127.0.0.1:${FRONTEND_PORT}/api/live/rooms/${ROOM_ID}/close" \
            | jq -e '.code == 200 and .data.status == "offline"'

          kubectl -n "${KUBE_NAMESPACE}" get pods,services,persistentvolumeclaims -o wide

      - name: Run HPA scale experiment
        shell: bash
        env:
          HPA_SERVICE_URL: "http://127.0.0.1:${{ env.FRONTEND_PORT }}/api/live/rooms?page=1&pageSize=10"
          HPA_WORKERS: "64"
          HPA_LOAD_SECONDS: "45"
        run: |
          set -euo pipefail
          kubectl apply -f k8s/hpa.yml
          kubectl -n "${KUBE_NAMESPACE}" port-forward service/frontend "${FRONTEND_PORT}:80" \
            > "${RUNNER_TEMP}/hpa-frontend-port-forward.log" 2>&1 &
          FRONTEND_FORWARD_PID=$!
          trap 'kill ${FRONTEND_FORWARD_PID} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "${HPA_SERVICE_URL}" -o /dev/null; then break; fi
            if [ "${attempt}" -eq 30 ]; then cat "${RUNNER_TEMP}/hpa-frontend-port-forward.log"; exit 1; fi
            sleep 2
          done
          chmod +x scripts/hpa-smoke.sh
          for repetition in 1 2 3; do
            echo "===== HPA repetition ${repetition}/3 ====="
            HPA_OUTPUT_DIR="${RUNNER_TEMP}/hangyin-hpa/run-${repetition}" \
              scripts/hpa-smoke.sh
          done

      - name: Collect Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n "${KUBE_NAMESPACE}" get all,persistentvolumeclaims -o wide || true
          kubectl -n "${KUBE_NAMESPACE}" describe pods || true
          for deployment in mysql live-mysql srs minio backend live-service frontend; do
            kubectl -n "${KUBE_NAMESPACE}" logs "deployment/${deployment}" --all-containers --tail=200 || true
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-test-and-deployment-reports
          path: |
            live-service/target/surefire-reports/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/hangyin-hpa/
          if-no-files-found: warn
