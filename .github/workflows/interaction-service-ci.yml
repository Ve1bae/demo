name: Interaction Service CI

on:
  push:
    branches:
      - interaction-service
    paths:
      - "interaction-service/**"
      - ".github/workflows/interaction-service-ci.yml"
  pull_request:
    paths:
      - "interaction-service/**"
      - ".github/workflows/interaction-service-ci.yml"
  workflow_dispatch:

jobs:
  test-and-package:
    name: Unit and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: interaction-service/pom.xml
      - name: Run tests and package service
        working-directory: interaction-service
        run: mvn -B verify
