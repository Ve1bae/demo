name: user-service

on:
  push:
    branches: [user-service]
  pull_request:
    branches: [user-service]

jobs:
  service-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            port: 8081
    name: ${{ matrix.name }} build and test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test service
        working-directory: ${{ matrix.name }}
        run: mvn -B test
      - name: Build image
        run: docker build -t hangyin/${{ matrix.name }}:${{ github.sha }} ${{ matrix.name }}

  compose-validation:
    runs-on: ubuntu-latest
    needs: service-build-test
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment definition
        run: docker compose config --quiet

  user-service-e2e:
    runs-on: ubuntu-latest
    needs: service-build-test
    name: user-service HTTP end-to-end test
    steps:
      - uses: actions/checkout@v7
      - name: Start real user-service and MySQL
        run: |
          docker compose -f docker-compose.user-service-e2e.yml -p user-service-e2e up -d --build
      - name: Wait for health check
        run: |
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:18082/actuator/health && exit 0 || sleep 2
          done
          docker compose -f docker-compose.user-service-e2e.yml -p user-service-e2e logs user-service mysql
          exit 1
      - name: Run HTTP end-to-end test
        run: USER_SERVICE_E2E_BASE_URL=http://127.0.0.1:18082 node scripts/user-service-e2e.mjs
      - name: Upload end-to-end report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-service-e2e-report
          path: user-service/target/e2e-reports
      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.user-service-e2e.yml -p user-service-e2e down -v
