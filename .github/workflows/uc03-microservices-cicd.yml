name: UC-03 Microservices CI/CD
on:
  push: { branches: [microservice, 'feature/**'] }
  pull_request: { branches: [microservice] }
permissions: { contents: read, packages: write }
env: { COMPOSE_FILE: docker-compose.microservices.yml }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { service: [user-service, video-service, live-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test
  validate-compose:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-user
      MYSQL_VIDEO_PASSWORD: ci-${{ github.run_id }}-video
      MYSQL_LIVE_PASSWORD: ci-${{ github.run_id }}-live
      MINIO_ROOT_PASSWORD: ci-${{ github.run_id }}-minio
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f "$COMPOSE_FILE" config --quiet
  integration:
    runs-on: ubuntu-latest
    needs: [test, validate-compose]
    env:
      MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-user
      MYSQL_VIDEO_PASSWORD: ci-${{ github.run_id }}-video
      MYSQL_LIVE_PASSWORD: ci-${{ github.run_id }}-live
      MINIO_ROOT_PASSWORD: ci-${{ github.run_id }}-minio
    steps:
      - uses: actions/checkout@v4
      - run: docker volume create hangyin-microservices_microservices_user_db
      - run: docker compose -f "$COMPOSE_FILE" -p ci-microservices up -d --build mysql-user mysql-video mysql-live minio srs user-service video-service live-service api-gateway
      - name: Smoke tests
        run: |
          ready=0
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/gateway/health >/dev/null &&
              curl --fail --silent http://127.0.0.1:8080/api/live/rooms >/dev/null &&
              curl --fail --silent 'http://127.0.0.1:8080/api/videos/recommend?page=1&pageSize=1' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Timed out waiting for gateway and backend APIs'
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/gateway/health
          curl --fail http://127.0.0.1:8080/api/live/rooms
          curl --fail 'http://127.0.0.1:8080/api/videos/recommend?page=1&pageSize=1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Video, comment and danmaku API E2E
        env:
          E2E_API_BASE: http://127.0.0.1:8080/api
          E2E_VIDEO_ID: '930301'
          E2E_USER_ID: '1'
        run: node scripts/video-e2e.mjs
      - name: Live room API E2E
        env:
          UC07_E2E_BASE_URL: http://127.0.0.1:8080
          UC07_E2E_USER_ID: '1'
        run: node scripts/uc07-e2e.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Seed browser E2E data
        run: |
          docker compose -f "$COMPOSE_FILE" -p ci-microservices exec -T mysql-user sh -c 'mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" user_db' < infra/mysql/user-browser-e2e.sql
          docker compose -f "$COMPOSE_FILE" -p ci-microservices exec -T mysql-video sh -c 'mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" video_db' < video-service/sql/005_browser_e2e_test_data.sql
      - name: Install frontend dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Start frontend for browser E2E
        working-directory: frontend/demo
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../../frontend-e2e.log 2>&1 &
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0 || sleep 2; done
          cat ../../frontend-e2e.log
          exit 1
      - name: Install Playwright browser
        working-directory: frontend/demo
        run: npx playwright install --with-deps chromium
      - name: UC-03 browser E2E through gateway
        working-directory: frontend/demo
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE: http://127.0.0.1:8080/api
        run: npm run test:e2e:uc03
      - name: UC-08 to UC-10 browser E2E through gateway
        working-directory: frontend/demo
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE: http://127.0.0.1:8080/api
        run: npm run test:e2e:uc07-10
      - if: always()
        run: docker compose -f "$COMPOSE_FILE" -p ci-microservices logs --no-color > microservices-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: microservices-ci-logs, path: microservices-ci.log }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-browser-e2e-reports
          path: |
            frontend/demo/playwright-report
            frontend/demo/test-results
            frontend-e2e.log
      - if: always()
        run: docker compose -f "$COMPOSE_FILE" -p ci-microservices down -v --remove-orphans
  publish-images:
    if: github.event_name == 'push'
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { service: [user-service, video-service, live-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image with registry retry
        env:
          IMAGE: ghcr.io/ve1bae/${{ matrix.service }}:${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Publishing $IMAGE (attempt $attempt/3)"
            if docker buildx build \
              --file "$SERVICE/Dockerfile" \
              --tag "$IMAGE" \
              --push \
              "$SERVICE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Image publication failed after 3 attempts"
          exit 1
  deploy:
    if: github.event_name == 'push'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: hangyin-ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build versioned service images
        run: |
          docker build -t hangyin/user-service:${{ github.sha }} ./user-service
          docker build -t hangyin/video-service:${{ github.sha }} ./video-service
          docker build -t hangyin/live-service:${{ github.sha }} ./live-service
          docker build -t hangyin/frontend:${{ github.sha }} ./frontend/demo
          kind load docker-image hangyin/user-service:${{ github.sha }} --name hangyin-ci
          kind load docker-image hangyin/video-service:${{ github.sha }} --name hangyin-ci
          kind load docker-image hangyin/live-service:${{ github.sha }} --name hangyin-ci
          kind load docker-image hangyin/frontend:${{ github.sha }} --name hangyin-ci
      - name: Deploy microservices to Kubernetes
        shell: pwsh
        run: |
          ./scripts/deploy-microservices-k8s.ps1 -Namespace hangyin -ImageTag '${{ github.sha }}' -Registry hangyin -SkipBuild
      - name: Kubernetes health check
        run: |
          kubectl port-forward service/api-gateway 18080:8080 -n hangyin > k8s-port-forward.log 2>&1 &
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:18080/gateway/health && break || sleep 2; done
          curl --fail http://127.0.0.1:18080/api/live/rooms
          curl --fail 'http://127.0.0.1:18080/api/videos/recommend?page=1&pageSize=1'
          kubectl get pods,services,hpa -n hangyin
      - name: Run live-service HPA experiment
        shell: bash
        env:
          KUBE_NAMESPACE: hangyin
          HPA_SERVICE_URL: "http://127.0.0.1:18081/api/live/rooms?page=1&pageSize=10"
          HPA_OUTPUT_DIR: ${{ runner.temp }}/hangyin-hpa/live-service
          HPA_WORKERS: "32"
          HPA_LOAD_SECONDS: "75"
          HPA_SCALE_WAIT_SECONDS: "180"
        run: |
          set -euo pipefail
          kubectl apply -f k8s/microservices-hpa.yaml
          kubectl -n "$KUBE_NAMESPACE" port-forward service/live-service 18081:8090 > "$RUNNER_TEMP/live-service-hpa-port-forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$HPA_SERVICE_URL" -o /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat "$RUNNER_TEMP/live-service-hpa-port-forward.log"; exit 1; fi
            sleep 2
          done
          chmod +x scripts/hpa-smoke.sh
          scripts/hpa-smoke.sh
      - name: Run live-service fault handling experiment
        shell: bash
        env:
          KUBE_NAMESPACE: hangyin
          FAULT_SERVICE_URL: http://127.0.0.1:18082/api/live/srs/health
          FAULT_OUTPUT_DIR: ${{ runner.temp }}/hangyin-fault/live-service
        run: |
          set -euo pipefail
          kubectl -n "$KUBE_NAMESPACE" port-forward service/live-service 18082:8090 > "$RUNNER_TEMP/live-service-fault-port-forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$FAULT_SERVICE_URL" -o /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat "$RUNNER_TEMP/live-service-fault-port-forward.log"; exit 1; fi
            sleep 2
          done
          chmod +x scripts/fault-handling-smoke.sh
          scripts/fault-handling-smoke.sh
      - if: always()
        run: |
          kubectl get pods,services,hpa -n hangyin > k8s-status.txt || true
          kubectl get events -n hangyin --sort-by=.lastTimestamp > k8s-events.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-kubernetes-reports
          path: |
            k8s-status.txt
            k8s-events.txt
            k8s-port-forward.log
            ${{ runner.temp }}/live-service-*-port-forward.log
            ${{ runner.temp }}/hangyin-hpa/
            ${{ runner.temp }}/hangyin-fault/
