name: Backend Tests & CD

on:
  push:
    branches: [ main, master, videoplayer ]
  pull_request:
    branches: [ main, master, videoplayer ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ve1bae/demo-backend
  FRONTEND_IMAGE: ghcr.io/ve1bae/demo-frontend
  SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root

jobs:
  test:
    name: 后端测试 (UC-04/05/06, MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hangyin_video
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 安装 MySQL 客户端
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: 建表 + 导入测试数据
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < demo.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < backend/src/test/resources/data.sql
      - name: 运行测试
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: warn

  build-push:
    name: 构建镜像并推送 GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/demo
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: 部署到 kind (K8s)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          sudo install -m 755 kind /usr/local/bin/kind
      - name: 创建 kind 集群
        run: kind create cluster --name hangyin --wait 120s
      - name: 加载镜像到 kind
        run: |
          kind load docker-image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} --name hangyin
          kind load docker-image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} --name hangyin
      - name: 部署到 K8s
        run: |
          sed -i "s|ghcr.io/ve1bae/demo-backend:latest|ghcr.io/ve1bae/demo-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/ve1bae/demo-frontend:latest|ghcr.io/ve1bae/demo-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          kubectl apply -f k8s/
          echo "等待 MySQL 就绪..."
          kubectl -n hangyin wait --for=condition=ready pod -l app=mysql --timeout=120s || { kubectl -n hangyin get pods; exit 1; }
          echo "等待 Backend 就绪..."
          kubectl -n hangyin wait --for=condition=available deployment/backend --timeout=120s || { kubectl -n hangyin logs -l app=backend --tail=50; exit 1; }
          echo "等待 Frontend 就绪..."
          kubectl -n hangyin wait --for=condition=available deployment/frontend --timeout=60s || { kubectl -n hangyin get pods; exit 1; }
          kubectl -n hangyin get all

  health-check:
    name: 健康检查 - curl 验证
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          sudo install -m 755 kind /usr/local/bin/kind
      - name: 健康检查后端 API
        run: |
          kubectl port-forward svc/backend-service 19090:9090 -n hangyin &
          PF_PID=$!
          sleep 5
          curl -fsS http://localhost:19090/api/videos/recommend && echo "" || { echo "推荐视频接口失败"; kill $PF_PID; exit 1; }
          curl -fsS http://localhost:19090/api/videos/1 && echo "" || { echo "视频详情接口失败"; kill $PF_PID; exit 1; }
          curl -fsS "http://localhost:19090/api/videos/1/comments?page=1&pageSize=20" && echo "" || { echo "评论接口失败"; kill $PF_PID; exit 1; }
          echo "=== 健康检查全部通过 ==="
          kill $PF_PID
      - name: 清理 kind 集群
        if: always()
        run: kind delete cluster --name hangyin
