name: CI/CD

on:
  push:
    branches:
      - live-smoke-test
  workflow_dispatch:

env:
  SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root
  MINIO_ENDPOINT: http://127.0.0.1:9000
  MINIO_PUBLIC_BASE_URL: http://127.0.0.1:8082/video
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: hangyin-video
  LIVE_SRS_RTMP_BASE_URL: rtmp://127.0.0.1/live
  LIVE_SRS_HTTP_BASE_URL: http://127.0.0.1:8081
  LIVE_TRANSCODE_ENABLED: "false"
  VIDEO_TRANSCODE_ENABLED: "false"
  APP_HOST: 127.0.0.1

jobs:
  backend-test:
    name: Backend unit/API/E2E tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hangyin_video
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Create schema
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < demo.sql
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  browser-e2e:
    name: Browser E2E tests
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hangyin_video
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Create schema and test user
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < demo.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video -e \
            "INSERT INTO sys_user (username, password, nickname) VALUES ('livetester', 'x', '直播测试用户') ON DUPLICATE KEY UPDATE nickname = VALUES(nickname);"
      - name: Install frontend dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Start SRS
        run: |
          docker compose -f docker-compose.yml up -d srs
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/v1/versions >/dev/null 2>&1; then
              echo "SRS is ready"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml logs srs
          exit 1
      - name: Start backend
        working-directory: backend
        run: |
          chmod +x mvnw
          nohup ./mvnw -B spring-boot:run \
            -Dspring-boot.run.arguments="--server.port=18080 --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=root --minio.endpoint=http://127.0.0.1:9000 --minio.public-base-url=http://127.0.0.1:8082/video --minio.access-key=minioadmin --minio.secret-key=minioadmin --minio.bucket=hangyin-video --live.srs.rtmp-base-url=rtmp://127.0.0.1:1935/live --live.srs.http-base-url=http://127.0.0.1:8081 --live.transcode.enabled=false --video.transcode.enabled=false" \
            > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/live/rooms >/dev/null 2>&1; then
              echo "backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat ../backend.log
          exit 1
      - name: Start frontend
        working-directory: frontend/demo
        env:
          VITE_API_PORT: "18080"
        run: |
          nohup npm run dev -- --port 5173 --host 127.0.0.1 > ../vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1; then
              echo "frontend is ready"
              exit 0
            fi
            sleep 1
          done
          cat ../vite.log
          exit 1
      - name: Install Playwright browser
        working-directory: frontend/demo
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests (non-SRS)
        working-directory: frontend/demo
        env:
          E2E_API_BASE: http://127.0.0.1:18080/api
        run: npx playwright test --grep-invert "SRS"
      - name: Run browser E2E tests (SRS)
        working-directory: frontend/demo
        env:
          E2E_API_BASE: http://127.0.0.1:18080/api
          RUN_SRS_E2E: "true"
        run: npx playwright test --grep "SRS"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Install dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Build frontend
        working-directory: frontend/demo
        run: npm run build

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Install dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Build frontend
        working-directory: frontend/demo
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/demo/dist
