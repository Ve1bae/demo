name: CI/CD

on:
  push:
    branches:
      - live-smoke-test
  workflow_dispatch:

env:
  SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root
  MINIO_ENDPOINT: http://127.0.0.1:9000
  MINIO_PUBLIC_BASE_URL: http://127.0.0.1:8082/video
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: hangyin-video
  LIVE_SRS_RTMP_BASE_URL: rtmp://127.0.0.1/live
  LIVE_SRS_HTTP_BASE_URL: http://127.0.0.1:8081
  LIVE_TRANSCODE_ENABLED: "false"
  VIDEO_TRANSCODE_ENABLED: "false"
  APP_HOST: 127.0.0.1

jobs:
  backend-test:
    name: Backend and live smoke tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hangyin_video
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Create schema
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot hangyin_video < demo.sql
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Install dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Build frontend
        working-directory: frontend/demo
        run: npm run build

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/demo/package-lock.json
      - name: Install dependencies
        working-directory: frontend/demo
        run: npm ci
      - name: Build frontend
        working-directory: frontend/demo
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/demo/dist
