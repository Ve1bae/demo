spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Docker Compose exposes MySQL to the local development process on port 3307.
    # The containerized backend overrides this with mysql:3306.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

app:
  upload-dir: backend/uploads

live:
  srs:
    rtmp-base-url: ${LIVE_RTMP_BASE_URL:rtmp://${APP_HOST:localhost}/live}
    http-base-url: ${LIVE_HTTP_BASE_URL:http://${APP_HOST:localhost}:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://${APP_HOST:localhost}:8082/video}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: hangyin-video

video:
  chunk-dir: C:/hangyin/chunks
