server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: interaction-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
