apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-service
  namespace: hangyin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: live-service
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
