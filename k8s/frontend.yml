apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hangyin
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hangyin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: hangyin
    spec:
      containers:
        - name: frontend
          image: hangyin/frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hangyin
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
