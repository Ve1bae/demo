apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hangyin
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hangyin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hangyin/backend:ci
          imagePullPolicy: Never
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_PUBLIC_BASE_URL
              value: http://localhost:8082/video
            - name: LIVE_RTMP_BASE_URL
              value: rtmp://srs:1935/live
            - name: LIVE_HTTP_BASE_URL
              value: http://srs:8080
            - name: VIDEO_TRANSCODE_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/live/rooms
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
