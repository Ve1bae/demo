events {}
http {
    client_max_body_size 2g;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 80;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-User-Id,X-Username" always;
        if ($request_method = OPTIONS) { return 204; }
        location = /gateway/health { default_type application/json; return 200 '{"status":"UP","gateway":"nginx"}'; }
        location /api/user/ { proxy_pass http://user-service:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /api/users/ { proxy_pass http://user-service:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /api/videos/ { proxy_pass http://video-service:8082; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        # 视频上传包含 MinIO 写入和多清晰度转码，允许较长时间处理，避免网关先返回 504。
        location = /api/videos/upload {
            proxy_pass http://video-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_body_timeout 1800s;
        }
        location /api/comments/ { proxy_pass http://video-service:8082; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /api/minio/ { proxy_pass http://video-service:8082; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /api/live/ { proxy_pass http://live-service:8090; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /video/ { proxy_pass http://minio:9000/hangyin-video/; proxy_set_header Host minio:9000; proxy_set_header Range $http_range; proxy_set_header If-Range $http_if_range; proxy_http_version 1.1; proxy_buffering off; }
        location /ws/live/ { proxy_pass http://live-service:8090; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 3600s; }
        location / { return 404; }
    }
}
