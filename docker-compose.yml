services:
  mysql:
    image: mysql:8.4
    container_name: hangyin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hangyin_video
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-3dfbf77d62bf4fd8b7463e62fcea4800dd51f8fc20264f03a1542256ae0da5bc}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./demo.sql:/docker-entrypoint-initdb.d/01-demo.sql:ro
      - ./infra/mysql/user-db.sql:/docker-entrypoint-initdb.d/02-user-db.sql:ro
      - ./infra/mysql/migrate-user-db.sql:/docker-entrypoint-initdb.d/03-migrate-user-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  srs:
    image: ossrs/srs:5
    container_name: hangyin-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8081:8080"
      - "1985:1985"
    volumes:
      - ./infra/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    command: ["./objs/srs", "-c", "conf/srs.conf"]

  minio:
    image: minio/minio:latest
    container_name: hangyin-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-3dfbf77d62bf4fd8b7463e62fcea4800dd51f8fc20264f03a1542256ae0da5bc}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    container_name: hangyin-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      minio:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hangyin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hangyin_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mkj162829}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://localhost:8082/video
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-3dfbf77d62bf4fd8b7463e62fcea4800dd51f8fc20264f03a1542256ae0da5bc}
      MINIO_BUCKET: hangyin-video
      LIVE_RTMP_BASE_URL: rtmp://localhost/live
      LIVE_HTTP_BASE_URL: http://localhost:8081
      LIVE_TRANSCODE_ENABLED: "false"
      VIDEO_TRANSCODE_ENABLED: "false"
      APP_HOST: localhost
      APP_UPLOAD_DIR: /app/uploads
      VIDEO_CHUNK_DIR: /app/chunks
    volumes:
      - backend_uploads:/app/uploads
      - backend_chunks:/app/chunks
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      srs:
        condition: service_started

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: hangyin-user-service
    restart: unless-stopped
    ports:
      - "18081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mkj162829}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/demo
      dockerfile: Dockerfile
    container_name: hangyin-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  minio_data:
  backend_uploads:
  backend_chunks:
