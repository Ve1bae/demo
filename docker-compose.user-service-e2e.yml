services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hangyin_video
      MYSQL_ROOT_PASSWORD: e2e-password
    ports:
      - "13307:3306"
    volumes:
      - user_service_e2e_mysql_data:/var/lib/mysql
      - ./demo.sql:/docker-entrypoint-initdb.d/01-demo.sql:ro
      - ./infra/mysql/user-db.sql:/docker-entrypoint-initdb.d/02-user-db.sql:ro
      - ./infra/mysql/migrate-user-db.sql:/docker-entrypoint-initdb.d/03-migrate-user-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "18082:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: e2e-password
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  user_service_e2e_mysql_data:
