apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: video-service
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: video-mysql
  template:
    metadata:
      labels:
        app: video-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-db-secret
                  key: password
            - name: MYSQL_DATABASE
              value: "video_db"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: init-schema
          configMap:
            name: video-mysql-init
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: video-service
spec:
  selector:
    app: video-mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
