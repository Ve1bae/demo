apiVersion: v1
kind: Service
metadata:
  name: video-mysql
  namespace: hangyin
spec:
  selector:
    app: video-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-mysql
  namespace: hangyin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-mysql
  template:
    metadata:
      labels:
        app: video-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: video_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-db-secret
                  key: password
          volumeMounts:
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: init-schema
          configMap:
            name: video-db-init
        - name: data
          emptyDir: {}



