apiVersion: v1
kind: ConfigMap
metadata:
  name: video-service-config
  namespace: video-service
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
  SPRING_DATASOURCE_USERNAME: "root"
  MINIO_ENDPOINT: "http://minio-service:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  MINIO_BUCKET: "hangyin-video"
  VIDEO_TRANSCODE_ENABLED: "false"
  USER_SERVICE_BASE_URL: "http://user-service:8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: video-db-secret
  namespace: video-service
type: Opaque
stringData:
  password: "root"
