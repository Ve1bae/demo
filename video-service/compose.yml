services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${VIDEO_DB_PASSWORD:?Set VIDEO_DB_PASSWORD before starting Compose}
      MYSQL_DATABASE: video_db
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - video_mysql_data:/var/lib/mysql
      - ./sql/001_video_schema.sql:/docker-entrypoint-initdb.d/001_video_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - video_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  video-service:
    image: hangyin/video-service:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      args:
        IMAGE_VERSION: ${IMAGE_TAG:-0.1.0}
        VCS_REF: ${VCS_REF:-local}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${VIDEO_DB_PASSWORD:?Set VIDEO_DB_PASSWORD before starting Compose}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:18083/video
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hangyin-video
      VIDEO_TRANSCODE_ENABLED: "false"
      USER_SERVICE_ENABLED: "true"
      USER_SERVICE_BASE_URL: http://host.docker.internal:18082
    ports:
      - "127.0.0.1:18083:8082"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  video_mysql_data:
  video_minio_data:
