name: Video Service CI (Unit + API + Real E2E)

on:
  push:
    branches: [main, master, video-service]
  pull_request:
  workflow_dispatch:

jobs:
  # ============ Job 1：单元测试 + API 集成测试（H2，无需外部服务） ============
  unit-and-api:
    name: Unit & API tests (JUnit + MockMvc + H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: video-service/pom.xml
      - name: Run unit & API tests and package
        working-directory: video-service
        run: mvn -B verify
      - name: Upload JUnit surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-service-junit-reports
          path: video-service/target/surefire-reports/
          if-no-files-found: error

  # ============ Job 2：真实端到端测试（Playwright + 真实 MySQL + MinIO + 后端） ============
  e2e:
    name: Real E2E (Playwright, real MySQL + MinIO + backend)
    runs-on: ubuntu-latest
    needs: unit-and-api
    timeout-minutes: 30
    services:
      # 真实 MySQL 容器，端口映射到 runner 的 127.0.0.1:3306
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: video_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: video-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      # 真实 MinIO 容器（GitHub Actions services 不支持自定义 command，用 docker run）
      - name: Start MinIO (real object storage)
        run: |
          docker run -d --name video-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to start"; exit 1

      - name: Initialize video_db schema
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot video_db < video-service/sql/001_video_schema.sql

      # 真实启动 video-service 进程（连接上面的真实 MySQL 和 MinIO）
      - name: Start video-service (real process)
        working-directory: video-service
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_BASE_URL: http://127.0.0.1:9000/hangyin-video
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: hangyin-video
          VIDEO_TRANSCODE_ENABLED: "false"
          SERVER_PORT: "8082"
        run: |
          mvn -B -q spring-boot:run > ../video-service.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/actuator/health 2>/dev/null | grep -q '"UP"'; then
              echo "video-service ready"; exit 0
            fi
            sleep 2
          done
          echo "=== video-service.log ==="
          cat ../video-service.log
          exit 1

      # 安装 Playwright 并跑真实端到端测试
      - name: Run Playwright E2E tests
        working-directory: video-service/e2e
        run: |
          npm install
          npx playwright install chromium --with-deps
          npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-service-playwright-report
          path: video-service/e2e/playwright-report/
          if-no-files-found: warn
      # 关键：每一步输入/输出的 markdown 报告
      - name: Upload E2E input/output report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-service-e2e-input-output-report
          path: video-service/e2e/report/
          if-no-files-found: warn
