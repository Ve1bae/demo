server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: video-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

video:
  # 是否启用 FFmpeg 多清晰度转码；未安装 FFmpeg 时保持 false，仅保存原始文件
  transcode:
    enabled: ${VIDEO_TRANSCODE_ENABLED:false}
    ffmpeg-path: ${VIDEO_FFMPEG_PATH:ffmpeg}
    timeout-seconds: ${VIDEO_TRANSCODE_TIMEOUT:300}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:8082/video}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:hangyin-video}

# 个性化推荐：是否调用 user-service 获取用户偏好（关注/兴趣/已看）。
# 关闭或调用失败时自动降级为按热度排序，不影响服务可用性。
user-service:
  enabled: ${USER_SERVICE_ENABLED:false}
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  timeout-millis: ${USER_SERVICE_TIMEOUT_MILLIS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
