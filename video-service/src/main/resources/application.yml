server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: video-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

user-service:
  enabled: ${USER_SERVICE_ENABLED:false}
  base-url: ${USER_SERVICE_BASE_URL:http://user-service:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
