services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: video_db
      MYSQL_ROOT_PASSWORD: ${VIDEO_SERVICE_DB_PASSWORD:?set VIDEO_SERVICE_DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ./sql/001_video_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/004_recommendation_test_data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - video_test_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  video-service:
    image: hangyin/video-service:${VIDEO_SERVICE_IMAGE_TAG:-ci}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${VIDEO_SERVICE_DB_PASSWORD:?set VIDEO_SERVICE_DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:9000/hangyin-video
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hangyin-video
      VIDEO_TRANSCODE_ENABLED: "false"
      APP_VERSION: ${VIDEO_SERVICE_IMAGE_TAG:-ci}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  video_test_minio_data:


